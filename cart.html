<!DOCTYPE html>
<html lang="en">
<head>
    <title>Joey's Farm - Cart</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="main.css">
    <link rel="stylesheet" type="text/css" href="cart.css">
    <link rel="stylesheet" type="text/css" href="navbar.css">
</head>
<body class="has-fixed-nav">

    <nav class="navbar navbar-expand-md fixed-top navbar-solid">
        <button class="navbar-toggler navbar-dark" type="button" data-toggle="collapse" data-target="#main-navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-navigation">
          <ul class="navbar-nav align-items-center">
            <li class="nav-item">
              <a class="nav-link nav-outline-text" href="customer-orders.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-outline-text" href="Order.html">Order</a>
            </li>
            <li class="nav-item">
              <a class="btn nav-login-btn" href="Index.html">Logout</a>
            </li>
            <li class="nav-item">
              <a class="cart-icon-circle text-dark" href="cart.html" title="Cart">🛒</a>
            </li>
        </ul>
      </div>
    </nav>

    <div class="container mt-4">
        <div class="mb-4">
            <a href="Order.html" class="back-btn">&larr; Continue Shopping</a>
        </div>
        
        <h3 class="mb-4 text-dark font-weight-bold">Your Cart</h3>

        <div class="col-lg-10 mx-auto" id="cartItems">
            <!-- Cart items are rendered here by cart.js -->
        </div>
    </div>

    <div class="bottom-bar">
        <div class="cart-total-wrap">
            <span class="cart-total-label">Total:</span>
            <span class="cart-total" id="cartTotal">₱ 0.00</span>
        </div>
        <a href="order_finalize.html" class="btn btn-finalize" id="checkoutBtn">Proceed to Checkout</a>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    <script src="cart.js"></script>
</body>
</html>
