<!DOCTYPE html>
<html lang="en">
<head>
    <title>Joey's Farm - Cart</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="main.css">
    <link rel="stylesheet" type="text/css" href="cart.css">
</head>
<body>

    <nav class="navbar navbar-expand-md navbar-custom align-items-center justify-content-between">
        <a class="navbar-brand" href="Index.html">
            <img src="images/logo.png" alt="Joey's Farm" style="height: 50px;">
        </a>
        <div class="d-flex align-items-center">
            <a class="nav-link nav-outline-text" href="Index.html">Home</a>
            <a class="nav-link nav-outline-text" href="#">Order</a>
            <div class="cart-icon-circle text-dark">
                🛒
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="mb-4">
            <a href="Index.html" class="back-btn">&larr; Continue Shopping</a>
        </div>
        
        <h3 class="mb-4 text-dark font-weight-bold">Your Cart</h3>

        <div class="col-lg-10 mx-auto">
            
            <div class="cart-item-card d-flex flex-column flex-md-row align-items-center mb-4">
                <div class="product-img-placeholder mb-3 mb-md-0 mr-md-4">
                    Product<br>Image
                </div>
                <div class="d-flex flex-column flex-md-row align-items-center w-100 justify-content-between">
                    <h5 class="product-title mb-3 mb-md-0">Farm Fresh Organic Eggs (1 Dozen)</h5>
                    <div class="d-flex align-items-center ml-md-auto">
                        <div class="qty-control mr-4">
                            <button class="qty-btn">-</button>
                            <span class="qty-display">1</span>
                            <button class="qty-btn">+</button>
                        </div>
                        <span class="trash-icon" title="Remove item">🗑️</span>
                    </div>
                </div>
            </div>

            <div class="cart-item-card d-flex flex-column flex-md-row align-items-center mb-4">
                <div class="product-img-placeholder mb-3 mb-md-0 mr-md-4">
                    Product<br>Image
                </div>
                <div class="d-flex flex-column flex-md-row align-items-center w-100 justify-content-between">
                    <h5 class="product-title mb-3 mb-md-0">Free Range Jumbo Eggs (Tray)</h5>
                    <div class="d-flex align-items-center ml-md-auto">
                        <div class="qty-control mr-4">
                            <button class="qty-btn">-</button>
                            <span class="qty-display">1</span>
                            <button class="qty-btn">+</button>
                        </div>
                        <span class="trash-icon" title="Remove item">🗑️</span>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="bottom-bar">
        <a href="order_finalize.html" class="btn btn-finalize">Proceed to Checkout</a>
    </div>

</body>
</html>
