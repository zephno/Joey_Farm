<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joey's Farm | Customer Orders</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="customer-orders.css">
</head>
<body>
     <nav class="navbar navbar-expand-md sticky-top">
        <button class="navbar-toggler navbar-dark" type="button" data-toggle="collapse" data-target="#main-navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-navigation">
          <ul class="navbar-nav align-items-center">
            <li class="nav-item">
              <a class="nav-link nav-outline-text" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-outline-text" href="#">About</a>
            </li>
            <li class="nav-item">
              <a class="btn nav-login-btn" href="#" data-toggle="modal" data-target="#loginModal">Login</a>
            </li>
        </ul>
      </div>
    </nav>

    <main class="container-fluid px-3 px-md-4 py-4">
        <section class="customer-details-card mx-auto mb-4" aria-labelledby="customer-details-heading">
            <h1 id="customer-details-heading" class="h4 mb-4">Customer details</h1>

            <form>
                <div class="form-row align-items-center mb-3">
                    <label class="col-12 col-sm-3 col-md-2 col-form-label" for="customer-address">Address</label>
                    <div class="col-12 col-sm-6 col-md-4 mb-2 mb-sm-0">
                        <input id="customer-address" class="form-control" type="text" placeholder="Enter address">
                    </div>
                    <div class="col-12 col-sm-3 col-md-2">
                        <button class="btn btn-confirm btn-block" type="button">Confirm</button>
                    </div>
                </div>

                <div class="form-row align-items-center mb-3">
                    <label class="col-12 col-sm-3 col-md-2 col-form-label" for="customer-name">Name</label>
                    <div class="col-12 col-sm-6 col-md-4 mb-2 mb-sm-0">
                        <input id="customer-name" class="form-control" type="text" placeholder="Enter full name">
                    </div>
                    <div class="col-12 col-sm-3 col-md-2">
                        <button class="btn btn-confirm btn-block" type="button">Confirm</button>
                    </div>
                </div>

                <div class="form-row align-items-center">
                    <label class="col-12 col-sm-3 col-md-2 col-form-label" for="customer-contact">Contact No.</label>
                    <div class="col-12 col-sm-6 col-md-4 mb-2 mb-sm-0">
                        <input id="customer-contact" class="form-control" type="tel" placeholder="Enter contact number">
                    </div>
                    <div class="col-12 col-sm-3 col-md-2">
                        <button class="btn btn-confirm btn-block" type="button">Confirm</button>
                    </div>
                </div>
            </form>
        </section>

        <section aria-labelledby="order-history-heading">
            <h2 id="order-history-heading" class="h3 mb-2">Order history</h2>
            <div class="table-responsive">
                <table class="table table-bordered order-history-table mb-0">
                    <caption class="sr-only">Customer order history</caption>
                    <thead>
                        <tr>
                            <th scope="col">Order details</th>
                            <th scope="col">Receipt no.</th>
                            <th scope="col">Amount to be paid</th>
                            <th scope="col">Delivery date</th>
                            <th scope="col">Delivery status</th>
                            <th scope="col">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>—</td>
                            <td>—</td>
                            <td>—</td>
                            <td>—</td>
                            <td>—</td>
                            <td>
                                <button class="btn btn-danger btn-cancel" type="button">Cancel</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
