<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joey's Farm | Customer Orders</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="customer-orders.css">
    <link rel="stylesheet" href="navbar.css">

</head>
<body class="has-fixed-nav">
    <nav class="navbar navbar-expand-md fixed-top navbar-solid">
        <button class="navbar-toggler navbar-dark" type="button" data-toggle="collapse" data-target="#main-navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-navigation">
          <ul class="navbar-nav align-items-center">
            <li class="nav-item">
              <a class="nav-link nav-outline-text" href="customer-orders.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-outline-text" href="Order.html">Order</a>
            </li>
            <li class="nav-item">
              <a class="btn nav-login-btn" href="Index.html">Logout</a>
            </li>
            <li class="nav-item">
              <a class="cart-icon-circle text-dark" href="cart.html" title="Cart">🛒</a>
            </li>
        </ul>
      </div>
    </nav>

    <div class="container-fluid px-3 px-md-4 py-4">
        <div class="customer-details-card mx-auto mb-4">
            <h2 id="customer-details-heading" class="mb-4">Customer details</h2>

            <form id="customer-details-form">
                <div class="form-row align-items-center mb-3">
                    <label class="col-12 col-sm-3 col-md-2 col-form-label" for="customer-address">Address:</label>
                    <div class="col-12 col-sm-9 col-md-6">
                        <input id="customer-address" name="address" class="form-control" type="text" placeholder="Enter address" required>
                    </div>
                </div>

                <div class="form-row align-items-center mb-3">
                    <label class="col-12 col-sm-3 col-md-2 col-form-label" for="customer-name">Name:</label>
                    <div class="col-12 col-sm-9 col-md-6">
                        <input id="customer-name" name="name" class="form-control" type="text" placeholder="Enter full name" required>
                    </div>
                </div>

                <div class="form-row align-items-center">
                    <label class="col-12 col-sm-3 col-md-2 col-form-label" for="customer-contact">Contact No.:</label>
                    <div class="col-12 col-sm-9 col-md-6">
                        <input id="customer-contact" name="contact" class="form-control" type="tel" placeholder="Enter 8-digit contact number (e.g. 12345678)" pattern="[0-9]{8}" maxlength="8" inputmode="numeric" title="Enter exactly 8 digits (e.g. 12345678)" required>
                    </div>
                </div>

                <div class="form-row mt-3">
                    <div class="col-12 col-sm-9 col-md-6 offset-sm-3 offset-md-2">
                        <button class="btn btn-confirm" type="submit">Submit details</button>
                    </div>
                </div>
            </form>
        </div>

        <div>
            <h2 id="order-history-heading" class="h3 mb-2">Order history</h2>
            <div class="table-responsive">
                <table class="table table-bordered order-history-table mb-0">
                    <thead>
                        <tr>
                            <th scope="col">Order details</th>
                            <th scope="col">Receipt no.</th>
                            <th scope="col">Amount to be paid</th>
                            <th scope="col">Delivery date</th>
                            <th scope="col">Delivery status</th>
                            <th scope="col">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>—</td>
                            <td>—</td>
                            <td>—</td>
                            <td>—</td>
                            <td>—</td>
                            <td>
                                <button class="btn btn-danger btn-cancel" type="button">Cancel</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="loginModal" tabindex="-1" role="dialog" aria-labelledby="loginModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title" id="loginModalTitle">Login to Joey's Farm</h1>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="loginEmail">Email address</label>
                            <input type="email" class="form-control" id="loginEmail" placeholder="Enter email" required>
                        </div>
                        <div class="form-group">
                            <label for="loginPassword">Password</label>
                            <input type="password" class="form-control" id="loginPassword" placeholder="Password" required>
                        </div>
                        <div class="form-check mb-3">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">Remember me</label>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Login</button>
                    </form>
                </div>
                <div class="modal-footer justify-content-between">
                    <small><a href="#">Forgot password?</a></small>
                    <small>Don't have an account? <a href="#">Sign up</a></small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    <script src="customer.js"></script>
</body>
</html>
