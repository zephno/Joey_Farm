<!DOCTYPE html>
<html lang="en">
<head>
    <title>Joey's Farm - Finalize Order</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="main.css">
    <link rel="stylesheet" type="text/css" href="order_finalize.css">
    <link rel="stylesheet" type="text/css" href="navbar.css">
</head>
<body class="has-fixed-nav">

    <nav class="navbar navbar-expand-md fixed-top navbar-solid">
        <button class="navbar-toggler navbar-dark" type="button" data-toggle="collapse" data-target="#main-navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-navigation">
          <ul class="navbar-nav align-items-center">
            <li class="nav-item">
              <a class="nav-link nav-outline-text" href="customer-orders.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-outline-text" href="Order.html">Order</a>
            </li>
            <li class="nav-item">
              <a class="btn nav-login-btn" href="Index.html">Logout</a>
            </li>
            <li class="nav-item">
              <a class="cart-icon-circle text-dark" href="cart.html" title="Cart">🛒</a>
            </li>
        </ul>
      </div>
    </nav>

    <div class="container-fluid px-3 px-md-4 py-4">
        <div class="customer-details-card mx-auto mb-2 px-0 border-0 bg-transparent">
            <a href="cart.html" class="back-btn">&larr; Back to Cart</a>
        </div>

        <div class="customer-details-card mx-auto mb-4">
            <h2 id="customer-details-heading" class="mb-4">Customer details</h2>

            <form id="customer-details-form" data-sync="receive-only">
                <div class="form-row align-items-center mb-3">
                    <label class="col-12 col-sm-3 col-md-2 col-form-label" for="customer-address">Address:</label>
                    <div class="col-12 col-sm-9 col-md-6">
                        <input id="customer-address" name="address" class="form-control" type="text" placeholder="Enter delivery address" required>
                    </div>
                </div>

                <div class="form-row align-items-center mb-3">
                    <label class="col-12 col-sm-3 col-md-2 col-form-label" for="customer-name">Name:</label>
                    <div class="col-12 col-sm-9 col-md-6">
                        <input id="customer-name" name="name" class="form-control" type="text" placeholder="Enter full name" required>
                    </div>
                </div>

                <div class="form-row align-items-center mb-3">
                    <label class="col-12 col-sm-3 col-md-2 col-form-label" for="customer-contact">Contact No.:</label>
                    <div class="col-12 col-sm-9 col-md-6">
                        <input id="customer-contact" name="contact" class="form-control" type="tel" placeholder="Enter 8-digit contact number (e.g. 12345678)" pattern="[0-9]{8}" maxlength="8" inputmode="numeric" title="Enter exactly 8 digits (e.g. 12345678)" required>
                    </div>
                </div>

                <div class="form-row align-items-center">
                    <label class="col-12 col-sm-3 col-md-2 col-form-label" for="customer-payment">Payment:</label>
                    <div class="col-12 col-sm-9 col-md-6">
                        <input id="customer-payment" name="payment" class="form-control" type="text" placeholder="Enter payment method" required>
                    </div>
                </div>

                <div class="form-row mt-3">
                    <div class="col-12 col-sm-9 col-md-6 offset-sm-3 offset-md-2">
                        <button class="btn btn-confirm" type="submit">Submit details</button>
                    </div>
                </div>
            </form>

            <div class="info-box mt-4">
                <p class="info-text">
                    💡 If you have already saved your details on the homepage, these fields will be auto-filled for your convenience.
                </p>
            </div>

            <div class="action-footer d-flex flex-column flex-md-row align-items-center justify-content-between">
                <p class="return-text mb-3 mb-md-0">
                    You will be redirected to the homepage after finalizing your order.
                </p>
                <a href="customer-orders.html" class="btn btn-finalize">Finalize Order</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    <script src="customer.js"></script>
</body>
</html>
