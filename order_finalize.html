    <div class="container py-4 mt-5" style="max-width: 800px;">
        <p><a href="cart.html" class="text-dark font-weight-bold">&larr; Back to Cart</a></p>

        <div class="customer-details-card mx-auto p-4 bg-white shadow-sm rounded">
            <h2 class="card-section-title mb-4">Customer details</h2>

            <form id="customer-details-form" data-sync="receive-only" autocomplete="off">
                <div class="form-group row">
                    <label class="col-12 col-sm-3 col-form-label font-weight-bold" for="customer-address">Address:</label>
                    <div class="col-12 col-sm-9">
                        <input id="customer-address" name="address" class="form-control" type="text" placeholder="e.g. 123 Farmville St, City" required>
                    </div>
                </div>

                <div class="form-group row">
                    <label class="col-12 col-sm-3 col-form-label font-weight-bold" for="customer-name">Name:</label>
                    <div class="col-12 col-sm-9">
                        <input id="customer-name" name="name" class="form-control" type="text" placeholder="e.g. Juan Dela Cruz" required>
                    </div>
                </div>

                <div class="form-group row">
                    <label class="col-12 col-sm-3 col-form-label font-weight-bold" for="customer-contact">Contact No.<br><small class="text-muted">(09XXXXXXXXX):</small></label>
                    <div class="col-12 col-sm-9">
                        <!-- Strict 11 digits: 09 + 9 numeric digits -->
                        <input id="customer-contact" name="contact" class="form-control" type="tel" placeholder="09123456789" pattern="09[0-9]{9}" maxlength="11" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')" title="Enter exactly 11 digits starting with 09 (e.g. 09123456789)" required>
                    </div>
                </div>

                <div class="form-group row mb-4">
                    <label class="col-12 col-sm-3 col-form-label font-weight-bold" for="customer-payment">Payment:</label>
                    <div class="col-12 col-sm-9">
                        <select id="customer-payment" name="payment" class="form-control" required>
                            <option value="Cash on Delivery (COD)">Cash on Delivery (COD)</option>
                            <option value="GCash">GCash</option>
                        </select>
                    </div>
                </div>

                <div class="alert alert-warning small">
                    <i class="fas fa-thumbtack mr-1"></i> These fields are filled from your account details. You can update them from My Account.
                </div>
            </form>
        </div>

        <div class="action-footer text-center mt-4">
            <p class="text-muted small mb-2">After placing your order, you will return to your account and order history.</p>
            <button type="button" class="btn btn-finalize btn-confirm btn-lg px-5 font-weight-bold text-white rounded-pill">Finalize Order</button>
        </div>
