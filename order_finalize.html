<!DOCTYPE html>
<html lang="en">
<head>
    <title>Joey's Farm - Finalize Order</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="main.css">
    <link rel="stylesheet" type="text/css" href="order_finalize.css">
</head>
<body>

    <nav class="navbar navbar-expand-md navbar-custom align-items-center justify-content-between">
        <a class="navbar-brand" href="Index.html">
            <img src="images/logo.png" alt="Joey's Farm" style="height: 50px;">
        </a>
        <div class="d-flex align-items-center">
            <a class="nav-link nav-outline-text" href="customer-orders.html">Home</a>
            <a class="nav-link nav-outline-text" href="Order.html">Order</a>
            <a class="btn nav-login-btn" href="Index.html">Logout</a>
            <div class="cart-icon-circle text-dark">
                🛒
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        
        <div class="col-lg-10 mx-auto px-0 mb-2">
            <a href="cart.html" class="back-btn">&larr; Back to Cart</a>
        </div>

        <div class="checkout-card col-lg-10 mx-auto">
            <h4 class="checkout-title">Customer Details</h4>
            
            <div class="row">
                <div class="col-md-7">
                    
                    <div class="form-group row align-items-center mb-4">
                        <label class="col-sm-3 col-form-label custom-label text-md-left">Address</label>
                        <div class="col-sm-6 mb-2 mb-sm-0">
                            <input type="text" class="form-control custom-input" placeholder="Enter delivery address">
                        </div>
                        <div class="col-sm-3">
                            <button class="btn btn-confirm">Confirm</button>
                        </div>
                    </div>

                    <div class="form-group row align-items-center mb-4">
                        <label class="col-sm-3 col-form-label custom-label text-md-left">Name</label>
                        <div class="col-sm-6 mb-2 mb-sm-0">
                            <input type="text" class="form-control custom-input" placeholder="Enter full name">
                        </div>
                        <div class="col-sm-3">
                            <button class="btn btn-confirm">Confirm</button>
                        </div>
                    </div>

                    <div class="form-group row align-items-center mb-4">
                        <label class="col-sm-3 col-form-label custom-label text-md-left">Contact No.</label>
                        <div class="col-sm-6 mb-2 mb-sm-0">
                            <input type="text" class="form-control custom-input" placeholder="Enter phone number">
                        </div>
                        <div class="col-sm-3">
                            <button class="btn btn-confirm">Confirm</button>
                        </div>
                    </div>

                    <div class="form-group row align-items-center mb-4">
                        <label class="col-sm-3 col-form-label custom-label text-md-left">Payment</label>
                        <div class="col-sm-6 mb-2 mb-sm-0">
                            <input type="text" class="form-control custom-input" placeholder="Select payment method">
                        </div>
                        <div class="col-sm-3">
                            <button class="btn btn-confirm">Confirm</button>
                        </div>
                    </div>

                </div>

                <div class="col-md-5 mt-4 mt-md-0">
                    <div class="info-box">
                        <p class="info-text">
                            💡 If you have already saved your details on the homepage, these fields will be auto-filled for your convenience.
                        </p>
                    </div>
                </div>
            </div>

            <div class="action-footer d-flex flex-column flex-md-row align-items-center justify-content-between">
                <p class="return-text mb-3 mb-md-0">
                    You will be redirected to the homepage after finalizing your order.
                </p>
                <a href="customer-orders.html" class="btn btn-finalize">Finalize Order</a>
            </div>

        </div>
    </div>

</body>
</html>
